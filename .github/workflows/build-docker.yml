name: Build Docker Image

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/chatwoot-custom:latest
            ${{ secrets.DOCKER_USERNAME }}/chatwoot-custom:${{ github.sha }}
          build-args: |
            VITE_ELEVENLABS_AGENT_ID=agent_6601kc1fqeecfc88s7d52jde0syq
            VITE_ELEVENLABS_VOICE_ID=
            VITE_ELEVENLABS_AGENT_NAME=AI Assistant
          cache-from: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/chatwoot-custom:buildcache
          cache-to: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/chatwoot-custom:buildcache,mode=max
