name: Build & Push Docker Image

# Builds the custom Chatwoot image and pushes it to GitHub Container Registry
# (GHCR) on every push to `main` and on every tag push (vX.Y.Z). The image is
# tagged with:
#   - the short commit SHA       (e.g. ghcr.io/jatinn71/chatwoot-custom:a1b2c3d)
#   - the git ref name           (e.g. ghcr.io/jatinn71/chatwoot-custom:main)
#   - the version tag if any     (e.g. ghcr.io/jatinn71/chatwoot-custom:v1.0.0)
#   - `latest`                   (only on main branch)
#
# SPEED: target 3-5 min on repeat builds (was 20 min)
#   - Single platform linux/amd64 only (multi-platform doubles build time)
#   - GHA layer cache (type=gha, mode=max) caches git clone + pnpm install layers
#   - Dockerfile splits git clone and pnpm install as separate layers
#   - pnpm store uses --mount=type=cache for persistent disk cache

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  workflow_dispatch:

# Permissions the auto-issued GITHUB_TOKEN needs to push to GHCR.
permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Generates a sensible set of tags + OCI labels from the git ref.
      # Docs: https://github.com/docker/metadata-action
      - name: Compute image tags + labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/chatwoot-custom
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # GHA layer cache — caches ALL intermediate layers (mode=max).
          # This means git clone + pnpm install layers are reused on
          # repeat builds. Only vite build re-runs (~3-5 min).
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Image summary
        run: |
          echo "### Pushed image tags" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.meta.outputs.tags }}" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "Pull with:" >> $GITHUB_STEP_SUMMARY
          echo '```bash' >> $GITHUB_STEP_SUMMARY
          echo "docker pull ghcr.io/${{ github.repository_owner }}/chatwoot-custom:latest" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
