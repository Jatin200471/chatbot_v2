name: Build & Deploy (Hard Refresh)

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  # ── Job 1: Build Docker image and push to GHCR ──────────────────────────────
  build:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.meta.outputs.tags }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set lowercase owner
        id: owner
        run: echo "name=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags + labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ steps.owner.outputs.name }}/chatwoot-hardrefresh
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      # Minify only on version tags (production releases).
      # Branch pushes skip minification — saves ~3 min per dev build.
      - name: Set build flags
        id: flags
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "minify=true" >> $GITHUB_OUTPUT
          else
            echo "minify=false" >> $GITHUB_OUTPUT
          fi

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            CACHEBUST=${{ github.run_number }}
            MINIFY=${{ steps.flags.outputs.minify }}
          cache-from: |
            type=gha
            type=registry,ref=ghcr.io/${{ steps.owner.outputs.name }}/chatwoot-hardrefresh:buildcache
          cache-to: |
            type=gha,mode=max
            type=registry,ref=ghcr.io/${{ steps.owner.outputs.name }}/chatwoot-hardrefresh:buildcache,mode=max

      - name: Image size report
        if: always()
        run: |
          SIZE=$(docker manifest inspect ghcr.io/${{ steps.owner.outputs.name }}/chatwoot-hardrefresh:latest \
            | python3 -c "import sys,json; m=json.load(sys.stdin); print(round(sum(l['size'] for l in m.get('layers',[])) / 1024**2, 1))" 2>/dev/null || echo "N/A")
          echo "### Build Complete" >> $GITHUB_STEP_SUMMARY
          echo "| | |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| Image size | ${SIZE} MB |" >> $GITHUB_STEP_SUMMARY
          echo "| Tags | \`${{ steps.meta.outputs.tags }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
          echo "docker pull ghcr.io/${{ steps.owner.outputs.name }}/chatwoot-hardrefresh:latest" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY

  # ── Job 2: Deploy to server (only on main branch push) ──────────────────────
  # Requires these GitHub Secrets to be set in repo Settings → Secrets:
  #   SSH_HOST   — server IP or domain (e.g. 157.90.123.45)
  #   SSH_USER   — SSH username (e.g. root or ubuntu)
  #   SSH_KEY    — SSH private key (paste full contents of id_rsa / id_ed25519)
  #   DEPLOY_PATH — path on server where docker-compose.yaml lives
  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name != 'workflow_dispatch' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Check deploy secrets
        id: check
        run: |
          if [ -z "${{ secrets.SSH_HOST }}" ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "⚠️ SSH_HOST secret not set — skipping deploy. Add secrets to enable auto-deploy." >> $GITHUB_STEP_SUMMARY
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Deploy to server via SSH
        if: steps.check.outputs.skip == 'false'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            set -e
            cd ${{ secrets.DEPLOY_PATH }}

            echo "=== Pulling latest image ==="
            docker compose pull

            echo "=== Restarting containers ==="
            docker compose up -d --remove-orphans

            echo "=== Waiting for health check ==="
            sleep 15
            docker compose ps

            echo "=== Deploy complete ==="

      - name: Deploy summary
        if: steps.check.outputs.skip == 'false'
        run: |
          echo "### Deploy Complete ✅" >> $GITHUB_STEP_SUMMARY
          echo "Server: \`${{ secrets.SSH_HOST }}\`" >> $GITHUB_STEP_SUMMARY
          echo "Image: \`ghcr.io/${{ github.repository_owner }}/chatwoot-hardrefresh:latest\`" >> $GITHUB_STEP_SUMMARY
