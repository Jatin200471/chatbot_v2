services:
  postgres:
    image: pgvector/pgvector:pg14
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - '5432:5432'
    environment:
      POSTGRES_DB: ${POSTGRES_DATABASE}
      POSTGRES_USER: ${POSTGRES_USERNAME}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_INITDB_ARGS: '--encoding=UTF8 --locale=C'
    networks:
      - chatwoot-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USERNAME} -d ${POSTGRES_DATABASE}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    networks:
      - chatwoot-network
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $${REDIS_PASSWORD} ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  rails:
    image: ghcr.io/jatinn71/chatwoot-custom:latest
    pull_policy: always
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file: .env
    ports:
      - '${PORT:-3001}:3000'
    volumes:
      - storage_data:/app/storage
      - ./logs:/app/log
    environment:
      DB_POOL: ${RAILS_MAX_THREADS:-5}
      DISABLE_DATABASE_ENVIRONMENT_CHECK: '1'
    networks:
      - chatwoot-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/health || exit 1"]
      interval: 30s
      timeout: 15s
      retries: 10
      start_period: 120s
    command:
      - sh
      - -c
      - |
        set -e
        mkdir -p /app/log /app/tmp/pids

        # ── Auto-generate SECRET_KEY_BASE (persist across restarts) ──────────
        SECRET_FILE=/app/storage/.secret_key_base
        if [ -z "$$SECRET_KEY_BASE" ]; then
          if [ -f "$$SECRET_FILE" ]; then
            export SECRET_KEY_BASE=$$(cat "$$SECRET_FILE")
            echo "Loaded SECRET_KEY_BASE from persistent storage."
          else
            export SECRET_KEY_BASE=$$(openssl rand -hex 64)
            echo "$$SECRET_KEY_BASE" > "$$SECRET_FILE"
            echo "Generated new SECRET_KEY_BASE and saved to persistent storage."
          fi
        else
          echo "Using SECRET_KEY_BASE from environment."
        fi

        rm -f /app/tmp/pids/server.pid
        echo 'Waiting for database...'
        until bundle exec rails db:version >/dev/null 2>&1; do
          echo 'Database not ready yet, waiting...'
          sleep 5
        done
        echo 'Database ready! Running setup...'
        bundle exec rails db:chatwoot_prepare
        echo 'Syncing ENABLE_ACCOUNT_SIGNUP...'
        bundle exec rails runner "
          ic = InstallationConfig.find_by(name: 'ENABLE_ACCOUNT_SIGNUP');
          if ic
            if SuperAdmin.exists?
              ic.update!(value: 'false')
              puts 'Super admin exists — signup disabled automatically.'
            else
              ic.update!(value: ENV.fetch('ENABLE_ACCOUNT_SIGNUP', 'false'))
              puts 'No super admin yet — signup value set from ENV.'
            end
          end
        " || echo 'InstallationConfig sync skipped'
        echo 'Starting Rails server...'
        exec bundle exec rails s -p 3000 -b '0.0.0.0'

  sidekiq:
    image: ghcr.io/jatinn71/chatwoot-custom:latest   # ← same image as rails
    pull_policy: always
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rails:
        condition: service_healthy  # wait for db:prepare + SECRET_KEY_BASE file
    env_file: .env
    volumes:
      - storage_data:/app/storage  # shared volume — reads SECRET_KEY_BASE written by rails
      - ./logs:/app/log
    environment:
      DB_POOL: ${RAILS_MAX_THREADS:-5}
    networks:
      - chatwoot-network
    healthcheck:
      test: ["CMD-SHELL", "bundle exec sidekiq --version || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    command:
      - sh
      - -c
      - |
        set -e

        # ── Load SECRET_KEY_BASE written by rails container ───────────────────
        SECRET_FILE=/app/storage/.secret_key_base
        if [ -z "$$SECRET_KEY_BASE" ]; then
          echo "Waiting for SECRET_KEY_BASE from rails..."
          RETRIES=0
          until [ -f "$$SECRET_FILE" ]; do
            RETRIES=$$((RETRIES + 1))
            if [ $$RETRIES -ge 30 ]; then
              echo "ERROR: SECRET_KEY_BASE not found after 60s. Exiting."
              exit 1
            fi
            sleep 2
          done
          export SECRET_KEY_BASE=$$(cat "$$SECRET_FILE")
          echo "Loaded SECRET_KEY_BASE from persistent storage."
        else
          echo "Using SECRET_KEY_BASE from environment."
        fi

        echo 'Starting Sidekiq...'
        exec bundle exec sidekiq -C config/sidekiq.yml

volumes:
  postgres_data:
  redis_data:
  storage_data:

networks:
  chatwoot-network:
    driver: bridge