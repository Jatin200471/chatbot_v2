<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Voice Call</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --widget-color: #1f93ff;
      --widget-color-soft: rgba(31, 147, 255, 0.15);
    }

    html, body {
      height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI',
                   Roboto, 'Helvetica Neue', Arial, sans-serif;
      background: linear-gradient(180deg, #ffffff 0%, #f8fafc 100%);
      color: #1e293b;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }

    body {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    /* ── Header bar ────────────────────────────────────────────────────── */
    .header {
      flex-shrink: 0;
      padding: 14px 20px;
      border-bottom: 1px solid #e2e8f0;
      background: #fff;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .header-title {
      font-size: 12px;
      font-weight: 700;
      color: #64748b;
      letter-spacing: 1.2px;
      text-transform: uppercase;
    }
    .live-badge {
      display: none;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      font-weight: 700;
      color: #ef4444;
      letter-spacing: 0.8px;
    }
    .live-badge.show { display: flex; }
    .live-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #ef4444;
      animation: blink 1.4s ease-in-out infinite;
    }
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50%      { opacity: 0.35; }
    }

    /* ── Main area: avatar + name + status ─────────────────────────────── */
    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 32px 24px;
      gap: 24px;
    }

    .avatar-stack {
      position: relative;
      width: 168px;
      height: 168px;
      display: grid;
      place-items: center;
    }

    /* Pulse rings around avatar (uses widget color) */
    .pulse-ring {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      border: 3px solid var(--widget-color);
      opacity: 0;
      pointer-events: none;
      animation: pulse-out 2.4s cubic-bezier(0.22, 0.61, 0.36, 1) infinite;
    }
    .pulse-ring:nth-child(2) { animation-delay: 0.8s; }
    .pulse-ring:nth-child(3) { animation-delay: 1.6s; }
    @keyframes pulse-out {
      0%   { transform: scale(1);    opacity: 0.6; }
      80%  { transform: scale(1.55); opacity: 0; }
      100% { transform: scale(1.55); opacity: 0; }
    }

    /* Avatar circle */
    .avatar {
      width: 144px;
      height: 144px;
      border-radius: 50%;
      object-fit: cover;
      background: var(--widget-color-soft);
      border: 4px solid var(--widget-color);
      box-shadow: 0 12px 32px rgba(15, 23, 42, 0.18);
      position: relative;
      z-index: 2;
      transition: box-shadow 0.25s ease, transform 0.25s ease;
    }

    /* When agent is speaking, avatar gets a stronger glow */
    .speaking .avatar {
      box-shadow: 0 12px 32px rgba(15, 23, 42, 0.18),
                  0 0 0 10px var(--widget-color-soft);
      transform: scale(1.03);
    }
    .speaking .pulse-ring {
      animation-duration: 1.2s;
    }

    /* ── Name + status ────────────────────────────────────────────────── */
    .info {
      text-align: center;
    }
    .agent-name {
      font-size: 22px;
      font-weight: 700;
      color: #0f172a;
      margin-bottom: 4px;
      letter-spacing: -0.2px;
    }
    .agent-role {
      font-size: 13px;
      color: #64748b;
      margin-bottom: 14px;
    }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 16px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 600;
      transition: all 0.2s ease;
    }
    .status[data-state="connecting"] {
      color: #b45309;
      background: #fffbeb;
      border: 1px solid #fde68a;
    }
    .status[data-state="connected"] {
      color: #15803d;
      background: #f0fdf4;
      border: 1px solid #bbf7d0;
    }
    .status[data-state="ended"],
    .status[data-state="error"] {
      color: #64748b;
      background: #f1f5f9;
      border: 1px solid #cbd5e1;
    }
    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: currentColor;
      animation: blink 1.4s ease-in-out infinite;
    }

    /* ── Action area: End Call button ─────────────────────────────────── */
    .actions {
      flex-shrink: 0;
      padding: 18px 24px 24px;
      display: flex;
      justify-content: center;
    }

    .end-call-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 14px 38px;
      border: none;
      border-radius: 999px;
      background: #ef4444;
      color: #fff;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 0.3px;
      cursor: pointer;
      box-shadow: 0 6px 18px rgba(239, 68, 68, 0.35);
      transition: all 0.18s ease;
    }
    .end-call-btn:hover:not(:disabled) {
      background: #dc2626;
      transform: translateY(-2px);
      box-shadow: 0 8px 22px rgba(239, 68, 68, 0.45);
    }
    .end-call-btn:active:not(:disabled) {
      transform: translateY(0);
    }
    .end-call-btn:disabled {
      background: #cbd5e1;
      color: #64748b;
      cursor: not-allowed;
      box-shadow: none;
      transform: none;
    }
    .end-call-btn svg {
      width: 20px;
      height: 20px;
    }

    /* ── Footer ───────────────────────────────────────────────────────── */
    .footer {
      flex-shrink: 0;
      padding: 12px 20px;
      border-top: 1px solid #e2e8f0;
      text-align: center;
      font-size: 11px;
      color: #94a3b8;
      background: #fff;
    }
    .footer strong {
      color: #64748b;
      font-weight: 600;
    }
  </style>
</head>

<body>
  <div class="header">
    <span class="header-title">Voice Call</span>
    <div class="live-badge" id="liveBadge">
      <span class="live-dot"></span>
      LIVE
    </div>
  </div>

  <div class="main" id="main">
    <div class="avatar-stack">
      <div class="pulse-ring"></div>
      <div class="pulse-ring"></div>
      <div class="pulse-ring"></div>
      <img class="avatar" id="avatarImg" alt="Agent" />
    </div>

    <div class="info">
      <div class="agent-name" id="agentName">AI Assistant</div>
      <div class="agent-role" id="agentRole">Voice Assistant</div>
      <div class="status" id="status" data-state="connecting">
        <span class="status-dot"></span>
        <span id="statusText">Connecting…</span>
      </div>
    </div>
  </div>

  <div class="actions">
    <button class="end-call-btn" id="endCallBtn" disabled>
      <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
        <path d="M3.5 14.5c5.5-5 11.5-5 17 0 .8.7.9 2 0 2.7l-2.1 1.6c-.5.4-1.2.4-1.7 0l-2-1.7
                 a1.5 1.5 0 0 1-.5-1.1V14a9.8 9.8 0 0 0-4.4 0v0c0 .4-.2.8-.5 1.1l-2 1.6c-.5.4-1.2.4-1.7 0
                 L3.5 15c-.5-.6-.4-1.7 0-2.5Z" transform="rotate(135 12 12)" />
      </svg>
      End Call
    </button>
  </div>

  <div class="footer">
    Powered by <strong id="brandName">Visual Graphx</strong>
  </div>

  <script type="module">
    /* ================================================================= *
     * Voice-call popup — runs the ElevenLabs ConvAI SDK in an isolated   *
     * browsing context. Survives parent-page hard refresh / navigation.  *
     * ================================================================= */

    // ── 1. Read config from URL params ──────────────────────────────────
    const params       = new URLSearchParams(location.search);
    const signedUrl    = params.get('signed_url')    || '';
    const websiteToken = params.get('website_token') || '';
    const apiBaseUrl   = params.get('base_url')      || location.origin;
    const widgetColor  = params.get('color')         || '#1f93ff';
    const avatarUrl    = params.get('avatar')        || '';
    const agentName    = params.get('agent_name')    || 'AI Assistant';
    const agentRole    = params.get('agent_role')    || 'Voice Assistant';
    const brandName    = params.get('brand')         || '';
    const authToken    = params.get('auth_token')    || '';
    const cwConv       = params.get('cw_conversation') || '';

    // ── 2. Apply widget color + branding to the DOM ─────────────────────
    document.documentElement.style.setProperty('--widget-color', widgetColor);
    document.documentElement.style.setProperty(
      '--widget-color-soft',
      hexToRgba(widgetColor, 0.15)
    );

    document.getElementById('agentName').textContent = agentName;
    document.getElementById('agentRole').textContent = agentRole;
    if (brandName) {
      document.getElementById('brandName').textContent = brandName;
    }

    // Avatar — use provided URL, or fall back to a colored initials circle
    const $avatar = document.getElementById('avatarImg');
    if (avatarUrl) {
      $avatar.src = avatarUrl;
      $avatar.onerror = () => { $avatar.src = makeFallbackAvatar(agentName, widgetColor); };
    } else {
      $avatar.src = makeFallbackAvatar(agentName, widgetColor);
    }

    // ── 3. State + DOM refs ─────────────────────────────────────────────
    const $status      = document.getElementById('status');
    const $statusText  = document.getElementById('statusText');
    const $endCallBtn  = document.getElementById('endCallBtn');
    const $liveBadge   = document.getElementById('liveBadge');
    const $main        = document.getElementById('main');

    let conversation = null;
    let isCallActive = false;
    let endedNotified = false;

    function setStatus(state, text) {
      $status.dataset.state = state;
      $statusText.textContent = text;
      if (state === 'connected') {
        $liveBadge.classList.add('show');
      } else {
        $liveBadge.classList.remove('show');
      }
    }

    // ── 4. Talk to the parent + opener pages ────────────────────────────
    function postToParents(event, payload = {}) {
      const msg = { source: 'cw-voice-popup', event, ...payload };
      // opener = the widget iframe that called window.open(...)
      try {
        if (window.opener && !window.opener.closed) {
          window.opener.postMessage(msg, '*');
          // opener.parent = the top-level page (visualgraphx.com)
          if (window.opener.parent && window.opener.parent !== window.opener) {
            window.opener.parent.postMessage(msg, '*');
          }
        }
      } catch (_) { /* opener may be cross-origin restricted */ }
    }

    function buildUrl(path) {
      let url = apiBaseUrl + path;
      const params = [];
      if (websiteToken) params.push('website_token=' + encodeURIComponent(websiteToken));
      if (cwConv)       params.push('cw_conversation=' + encodeURIComponent(cwConv));
      if (params.length) url += (url.includes('?') ? '&' : '?') + params.join('&');
      return url;
    }

    function apiPost(path, body) {
      return fetch(buildUrl(path), {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          ...(authToken ? { 'X-Auth-Token': authToken } : {}),
        },
        credentials: 'include',
        body: JSON.stringify(body || {}),
      });
    }

    // ── 5. Start the ElevenLabs session ─────────────────────────────────
    async function startCall() {
      if (!signedUrl) {
        setStatus('error', 'Missing signed URL');
        return;
      }

      try {
        setStatus('connecting', 'Requesting microphone…');
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        stream.getTracks().forEach(t => t.stop());

        setStatus('connecting', 'Loading voice engine…');
        const mod = await import('https://esm.sh/@elevenlabs/client@^0.5.0')
          .catch(() => import('https://esm.sh/@11labs/client'));
        const Conversation = mod.Conversation;
        if (!Conversation) throw new Error('SDK did not expose Conversation');

        setStatus('connecting', 'Connecting to agent…');
        conversation = await Conversation.startSession({
          signedUrl,

          onConnect: () => {
            isCallActive = true;
            setStatus('connected', 'Connected');
            $endCallBtn.disabled = false;
            postToParents('voice-popup-connected');
          },

          onDisconnect: () => {
            handleCallEnded('Call ended');
          },

          onError: (err) => {
            const msg = (err && (err.message || err.toString())) || 'Unknown error';
            console.error('[VOICE-POPUP] error:', msg);
            setStatus('error', 'Error: ' + msg);
            $endCallBtn.disabled = true;
            postToParents('voice-popup-error', { error: msg });
          },

          onMessage: ({ message, source }) => {
            const text = (message || '').toString().trim();
            if (!text) return;
            // Persist transcript to Chatwoot backend (so dashboard sees it
            // and so context-resume in the inline widget works too).
            apiPost('/api/v1/widget/conversations/voice_transcript', {
              source, content: text,
            }).catch(e => console.warn('Transcript save failed:', e?.message));
            postToParents('voice-popup-transcript', { source, message: text });
          },

          onModeChange: (mode) => {
            if (mode === 'speaking') $main.classList.add('speaking');
            else                     $main.classList.remove('speaking');
          },
        });

      } catch (error) {
        const msg = (error && error.message) || 'unknown';
        console.error('[VOICE-POPUP] startCall failed:', msg);
        if (error && (error.name === 'NotAllowedError' || error.name === 'NotFoundError')) {
          setStatus('error', 'Microphone permission denied');
        } else {
          setStatus('error', 'Failed: ' + msg);
        }
        $endCallBtn.disabled = true;
        postToParents('voice-popup-error', { error: msg });
      }
    }

    // ── 6. End the call ─────────────────────────────────────────────────
    async function endCall(reason) {
      if (!conversation) {
        handleCallEnded(reason || 'Call ended');
        return;
      }
      $endCallBtn.disabled = true;
      setStatus('connecting', 'Ending call…');
      try {
        await conversation.endSession();
      } catch (e) {
        console.warn('[VOICE-POPUP] endSession threw:', e?.message);
      }
      // onDisconnect will normally fire and call handleCallEnded.
      // Safety net if it doesn't:
      setTimeout(() => {
        if (isCallActive) handleCallEnded(reason || 'Call ended');
      }, 1500);
    }

    function handleCallEnded(label) {
      isCallActive = false;
      setStatus('ended', label || 'Call ended');
      $endCallBtn.disabled = true;
      conversation = null;

      if (!endedNotified) {
        endedNotified = true;
        // Tell the backend to reset its auto-resolve activity timer
        apiPost('/api/v1/widget/conversations/voice_call_ended', {})
          .catch(() => {});
        postToParents('voice-popup-ended');
      }
      // Auto-close the popup window shortly after the call ends
      setTimeout(() => { try { window.close(); } catch (_) {} }, 1500);
    }

    // ── 7. Wire up the End Call button ──────────────────────────────────
    $endCallBtn.addEventListener('click', () => endCall('Call ended'));

    // ── 8. Cleanup on window close / refresh ────────────────────────────
    window.addEventListener('beforeunload', () => {
      if (conversation && isCallActive) {
        try { conversation.endSession(); } catch (_) {}
      }
      if (!endedNotified) {
        endedNotified = true;
        // navigator.sendBeacon is more reliable during page unload
        try {
          const url = buildUrl('/api/v1/widget/conversations/voice_call_ended');
          navigator.sendBeacon(url, new Blob(['{}'], { type: 'application/json' }));
        } catch (_) {}
      }
      postToParents('voice-popup-closed');
    });

    // ── 9. Heartbeat so the widget iframe can detect us across a parent
    //       hard-refresh. Widget reads localStorage + listens on the
    //       broadcast channel; we write/post every ~1.5s while alive.
    const HEARTBEAT_KEY = 'cw_voice_popup_heartbeat';
    let _channel = null;
    try { _channel = new BroadcastChannel('cw-voice'); } catch (_) {}

    function writeHeartbeat() {
      try { localStorage.setItem(HEARTBEAT_KEY, String(Date.now())); } catch (_) {}
      if (_channel) {
        try {
          _channel.postMessage({
            type: 'heartbeat',
            timestamp: Date.now(),
            active: isCallActive,
          });
        } catch (_) {}
      }
    }
    function clearHeartbeat() {
      try { localStorage.removeItem(HEARTBEAT_KEY); } catch (_) {}
      if (_channel) {
        try { _channel.postMessage({ type: 'ended', timestamp: Date.now() }); } catch (_) {}
      }
    }

    writeHeartbeat();
    const _heartbeatTimer = setInterval(writeHeartbeat, 1500);

    // Respond to ping from the widget iframe (sent on mount after refresh)
    if (_channel) {
      _channel.addEventListener('message', (e) => {
        const m = e.data || {};
        if (m.type === 'ping') {
          writeHeartbeat();
        } else if (m.type === 'request-end-call') {
          endCall('Call ended');
        }
      });
    }

    // Also listen for direct postMessage from the widget iframe
    window.addEventListener('message', (e) => {
      const d = e?.data;
      if (d && typeof d === 'object' && d.source === 'cw-widget' && d.event === 'request-end-call') {
        endCall('Call ended');
      }
    });

    // Cleanup on unload — also fires when handleCallEnded calls window.close()
    window.addEventListener('beforeunload', () => {
      clearInterval(_heartbeatTimer);
      clearHeartbeat();
    });

    // ── 10. Notify opener + kick off the call ───────────────────────────
    postToParents('voice-popup-opened');
    startCall();

    // ── Helpers ─────────────────────────────────────────────────────────
    function hexToRgba(hex, alpha) {
      const m = (hex || '').replace('#', '').match(/^([0-9a-f]{6}|[0-9a-f]{3})$/i);
      if (!m) return `rgba(31, 147, 255, ${alpha})`;
      let h = m[1];
      if (h.length === 3) h = h.split('').map(c => c + c).join('');
      const r = parseInt(h.slice(0, 2), 16);
      const g = parseInt(h.slice(2, 4), 16);
      const b = parseInt(h.slice(4, 6), 16);
      return `rgba(${r}, ${g}, ${b}, ${alpha})`;
    }

    function makeFallbackAvatar(name, color) {
      const initials = (name || 'AI')
        .split(/\s+/).slice(0, 2).map(w => w[0]).join('').toUpperCase();
      const svg =
        `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
           <circle cx="50" cy="50" r="50" fill="${color}"/>
           <text x="50" y="62" text-anchor="middle"
                 font-family="Arial, sans-serif" font-size="38" font-weight="700"
                 fill="white">${initials}</text>
         </svg>`;
      return 'data:image/svg+xml;utf8,' + encodeURIComponent(svg);
    }
  </script>
</body>
</html>
