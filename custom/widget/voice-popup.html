<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="referrer" content="no-referrer" />
  <title>Voice Call</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --widget-color: #3b8fe8;
      --widget-color-soft: rgba(66, 153, 225, 0.22);
      --widget-color-strong: rgba(66, 153, 225, 0.40);

      --text-primary: #0f172a;
      --text-secondary: #64748b;
      --text-tertiary: #94a3b8;
      --border-tertiary: rgba(15, 23, 42, 0.10);
    }

    html, body {
      height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI',
                   Roboto, 'Helvetica Neue', Arial, sans-serif;
      background: #f1f5f9;
      color: var(--text-primary);
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 10px;
    }

    /* ── Desktop popup card (compact) ──────────────────────────────────── */
    .popup {
      width: 240px;                       /* was 280 */
      background: #fff;
      border-radius: 14px;                /* was 18 */
      border: 0.5px solid var(--border-tertiary);
      overflow: hidden;
      box-shadow: 0 3px 16px rgba(0, 0, 0, 0.10);
      max-height: calc(100vh - 20px);
    }

    .popup-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 7px 11px 5px;              /* was 10 14 8 */
      border-bottom: 0.5px solid var(--border-tertiary);
    }
    .popup-header .title {
      font-size: 9.5px;                   /* was 11 */
      font-weight: 500;
      letter-spacing: 0.06em;
      color: var(--text-secondary);
      text-transform: uppercase;
    }

    .live-badge {
      display: none;
      align-items: center;
      gap: 4px;                           /* was 5 */
      font-size: 9.5px;                   /* was 11 */
      font-weight: 500;
      color: #e8533a;
    }
    .live-badge.show { display: inline-flex; }
    .live-dot {
      width: 6px;                         /* was 7 */
      height: 6px;
      border-radius: 50%;
      background: #e8533a;
      animation: pulse 1.4s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50%      { opacity: 0.5; transform: scale(0.8); }
    }

    /* ── Body (compact) ────────────────────────────────────────────────── */
    .popup-body {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 16px 12px 12px;            /* was 22 16 18 */
    }

    .avatar-wrap {
      position: relative;
      width: 86px;                        /* was 110 */
      height: 86px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 10px;                /* was 14 */
    }
    .avatar-ring {
      position: absolute;
      border-radius: 50%;
      border: 1.25px solid var(--widget-color-soft);
    }
    .ring1 { width: 86px; height: 86px; } /* was 110 */
    .ring2 {
      width: 68px;                        /* was 88 */
      height: 68px;
      border-color: var(--widget-color-strong);
    }

    /* Avatar circle */
    .avatar {
      width: 54px;                        /* was 68 */
      height: 54px;
      border-radius: 50%;
      border: 2px solid var(--widget-color);  /* was 2.5 */
      object-fit: cover;
      background: var(--widget-color-soft);
      position: relative;
      z-index: 1;
      overflow: hidden;
      transition: transform 240ms ease, box-shadow 240ms ease;
    }
    .speaking .avatar {
      transform: scale(1.04);
      box-shadow: 0 0 0 5px var(--widget-color-soft);  /* was 6 */
    }
    .speaking .ring2 { animation: pulse-ring 1.6s ease-in-out infinite; }
    .speaking .ring1 { animation: pulse-ring 1.6s ease-in-out infinite 0.4s; }
    @keyframes pulse-ring {
      0%, 100% { opacity: 0.6; transform: scale(1); }
      50%      { opacity: 1;   transform: scale(1.04); }
    }

    .name {
      font-size: 13px;                    /* was 15 */
      font-weight: 500;
      color: var(--text-primary);
      margin-bottom: 2px;                 /* was 3 */
      max-width: 210px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      text-align: center;
    }
    .role {
      font-size: 10.5px;                  /* was 12 */
      color: var(--text-secondary);
      margin-bottom: 8px;                 /* was 11 */
    }

    .connected-badge {
      display: flex;
      align-items: center;
      gap: 4px;                           /* was 5 */
      border-radius: 18px;                /* was 20 */
      padding: 3px 10px;                  /* was 4 12 */
      font-size: 9.5px;                   /* was 11 */
      font-weight: 500;
    }
    .connected-badge[data-state="connecting"] {
      background: #fffbeb;
      border: 0.5px solid #fde68a;
      color: #b45309;
    }
    .connected-badge[data-state="connected"] {
      background: #edfaf3;
      border: 0.5px solid #a3e9c0;
      color: #1b7a47;
    }
    .connected-badge[data-state="ended"],
    .connected-badge[data-state="error"] {
      background: #f1f5f9;
      border: 0.5px solid #cbd5e1;
      color: #64748b;
    }
    .badge-dot {
      width: 6px;                         /* was 7 */
      height: 6px;
      border-radius: 50%;
      background: currentColor;
    }

    /* ── Footer (compact) ──────────────────────────────────────────────── */
    .popup-footer {
      padding: 0 12px 12px;               /* was 0 16 18 */
    }
    .end-btn {
      width: 100%;
      background: #e8533a;
      border: none;
      border-radius: 20px;                /* was 26 */
      color: #fff;
      font-size: 11.5px;                  /* was 13 */
      font-weight: 500;
      padding: 8px 0;                     /* was 11 */
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;                           /* was 7 */
      transition: background 0.15s;
    }
    .end-btn:hover:not(:disabled) { background: #c93f28; }
    .end-btn:active:not(:disabled) { transform: scale(0.98); }
    .end-btn:disabled {
      background: #cbd5e1;
      color: #64748b;
      cursor: not-allowed;
    }
    .end-btn svg { width: 12px; height: 12px; }  /* was 14 */

    /* ── Brand line (compact) ──────────────────────────────────────────── */
    .brand {
      padding: 0 12px 8px;                /* was 0 16 12 */
      text-align: center;
      font-size: 8.5px;                   /* was 10 */
      color: var(--text-tertiary);
      font-weight: 500;
    }
    .brand strong {
      color: var(--text-secondary);
      font-weight: 600;
    }

    /* ════════════════════════════════════════════════════════════════════ *
     *  MOBILE — ultra-compact 170px popup                                  *
     * ════════════════════════════════════════════════════════════════════ */
    @media (max-width: 480px) {
      .popup {
        width: 170px;                     /* was 200 */
        border-radius: 12px;
      }
      .popup-header { padding: 6px 9px 4px; }
      .popup-header .title { font-size: 8.5px; }
      .live-badge { font-size: 8.5px; }
      .live-dot { width: 5px; height: 5px; }

      .popup-body { padding: 12px 9px 10px; }
      .avatar-wrap {
        width: 64px;                      /* was 80 */
        height: 64px;
        margin-bottom: 8px;
      }
      .ring1 { width: 64px; height: 64px; }
      .ring2 { width: 50px; height: 50px; }
      .avatar {
        width: 40px;                      /* was 50 */
        height: 40px;
        border-width: 1.5px;
      }
      .name { font-size: 11px; margin-bottom: 2px; }
      .role { font-size: 9.5px; margin-bottom: 7px; }
      .connected-badge {
        padding: 2px 8px;
        font-size: 9px;
        gap: 3px;
      }
      .badge-dot { width: 5px; height: 5px; }
      .popup-footer { padding: 0 9px 10px; }
      .end-btn {
        font-size: 10.5px;
        padding: 7px 0;
        gap: 5px;
        border-radius: 18px;
      }
      .end-btn svg { width: 10px; height: 10px; }
      .brand { padding: 0 9px 8px; font-size: 8px; }
    }
  </style>
</head>

<body>
  <div class="popup">
    <div class="popup-header">
      <span class="title">Voice Call</span>
      <span class="live-badge" id="liveBadge">
        <span class="live-dot"></span>
        LIVE
      </span>
    </div>

    <div class="popup-body" id="popupBody">
      <div class="avatar-wrap">
        <div class="avatar-ring ring1"></div>
        <div class="avatar-ring ring2"></div>
        <img class="avatar" id="avatarImg" alt="Agent" />
      </div>
      <div class="name" id="agentName">AI Assistant</div>
      <div class="role" id="agentRole">Voice Assistant</div>
      <div class="connected-badge" id="status" data-state="connecting">
        <span class="badge-dot"></span>
        <span id="statusText">Connecting…</span>
      </div>
    </div>

    <div class="popup-footer">
      <button class="end-btn" id="endCallBtn" disabled aria-label="End call">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path d="M3.5 14.5c5.5-5 11.5-5 17 0 .8.7.9 2 0 2.7l-2.1 1.6c-.5.4-1.2.4-1.7 0l-2-1.7
                   a1.5 1.5 0 0 1-.5-1.1V14a9.8 9.8 0 0 0-4.4 0v0c0 .4-.2.8-.5 1.1l-2 1.6c-.5.4-1.2.4-1.7 0
                   L3.5 15c-.5-.6-.4-1.7 0-2.5Z" transform="rotate(135 12 12)" />
        </svg>
        End Call
      </button>
    </div>

    <div class="brand">
      Powered by <strong id="brandName">Visual Graphx</strong>
    </div>
  </div>

  <script type="module">
    /* ================================================================= *
     * Secure voice-call popup — compact UI.                              *
     * - Config delivered via postMessage (URL stays clean — no secrets). *
     * - ElevenLabs @11labs/client SDK runs here.                         *
     * - Heartbeat to backend so widget on other pages can detect call.   *
     * ================================================================= */

    const $avatar     = document.getElementById('avatarImg');
    const $agentName  = document.getElementById('agentName');
    const $agentRole  = document.getElementById('agentRole');
    const $brandName  = document.getElementById('brandName');
    const $status     = document.getElementById('status');
    const $statusText = document.getElementById('statusText');
    const $endCallBtn = document.getElementById('endCallBtn');
    const $liveBadge  = document.getElementById('liveBadge');
    const $body       = document.getElementById('popupBody');

    let cfg = null;
    let conversation = null;
    let isCallActive = false;
    let endedNotified = false;
    let _heartbeatTimer = null;
    let _backendHeartbeatTimer = null;
    let _configReceived = false;

    let _channel = null;
    try { _channel = new BroadcastChannel('cw-voice'); } catch (_) {}

    function setStatus(state, text) {
      $status.dataset.state = state;
      $statusText.textContent = text;
      $liveBadge.classList.toggle('show', state === 'connected');
    }
    function applyBranding(c) {
      document.documentElement.style.setProperty('--widget-color', c.color);
      document.documentElement.style.setProperty('--widget-color-soft', hexToRgba(c.color, 0.22));
      document.documentElement.style.setProperty('--widget-color-strong', hexToRgba(c.color, 0.40));
      $agentName.textContent = c.agentName;
      $agentRole.textContent = c.agentRole || 'Voice Assistant';
      if (c.brand) $brandName.textContent = c.brand;
      if (c.avatar) {
        $avatar.src = c.avatar;
        $avatar.onerror = () => { $avatar.src = makeFallbackAvatar(c.agentName, c.color); };
      } else {
        $avatar.src = makeFallbackAvatar(c.agentName, c.color);
      }
    }

    function postToOpener(event, payload = {}) {
      if (!window.opener || window.opener.closed) return;
      try {
        window.opener.postMessage({ source: 'cw-voice-popup', event, ...payload }, '*');
        if (window.opener.parent && window.opener.parent !== window.opener) {
          window.opener.parent.postMessage({ source: 'cw-voice-popup', event, ...payload }, '*');
        }
      } catch (_) {}
    }

    const HEARTBEAT_KEY = 'cw_voice_popup_heartbeat';
    function writeHeartbeat() {
      try { localStorage.setItem(HEARTBEAT_KEY, String(Date.now())); } catch (_) {}
      if (_channel) {
        try { _channel.postMessage({ type: 'heartbeat', timestamp: Date.now(), active: isCallActive }); } catch (_) {}
      }
    }
    function clearHeartbeat() {
      try { localStorage.removeItem(HEARTBEAT_KEY); } catch (_) {}
      if (_channel) {
        try { _channel.postMessage({ type: 'ended', timestamp: Date.now() }); } catch (_) {}
      }
    }

    function sendBackendHeartbeat() {
      if (!isCallActive) return;
      apiPost('/api/v1/widget/conversations/voice_heartbeat', {})
        .then(r => r.json().catch(() => null))
        .then(d => console.log('[VOICE-POPUP] 💓 heartbeat →', d))
        .catch(e => console.warn('[VOICE-POPUP] 💓 heartbeat FAILED:', e?.message));
    }
    function startBackendHeartbeat() {
      if (_backendHeartbeatTimer) return;
      sendBackendHeartbeat();
      _backendHeartbeatTimer = setInterval(sendBackendHeartbeat, 5000);
    }
    function stopBackendHeartbeat() {
      if (_backendHeartbeatTimer) {
        clearInterval(_backendHeartbeatTimer);
        _backendHeartbeatTimer = null;
      }
    }

    function apiPost(path, body) {
      if (!cfg) return Promise.reject(new Error('No config yet'));
      const url = new URL(path, cfg.baseUrl);
      if (cfg.websiteToken)   url.searchParams.set('website_token', cfg.websiteToken);
      if (cfg.cwConversation) url.searchParams.set('cw_conversation', cfg.cwConversation);
      return fetch(url.toString(), {
        method: 'POST',
        credentials: 'include',
        headers: {
          'Content-Type': 'application/json',
          ...(cfg.authToken ? { 'X-Auth-Token': cfg.authToken } : {}),
        },
        body: JSON.stringify(body || {}),
      });
    }

    window.addEventListener('message', (e) => {
      const d = e?.data;
      if (!d || typeof d !== 'object') return;
      if (d.source !== 'cw-widget') return;

      if (d.event === 'config' && d.config && !_configReceived) {
        _configReceived = true;
        cfg = d.config;
        applyBranding(cfg);
        startCall();
        return;
      }
      if (d.event === 'request-end-call') {
        endCall('Call ended');
        return;
      }
    });

    if (_channel) {
      _channel.addEventListener('message', (e) => {
        const m = e.data || {};
        if (m.type === 'ping') writeHeartbeat();
        else if (m.type === 'request-end-call') endCall('Call ended');
      });
    }

    async function startCall() {
      if (!cfg?.signedUrl) {
        setStatus('error', 'Missing signed URL');
        return;
      }

      writeHeartbeat();
      _heartbeatTimer = setInterval(writeHeartbeat, 1500);

      try {
        setStatus('connecting', 'Requesting mic…');
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        stream.getTracks().forEach(t => t.stop());

        setStatus('connecting', 'Loading…');
        const mod = await import('https://esm.sh/@11labs/client');
        const Conversation = mod.Conversation;
        if (!Conversation) throw new Error('SDK did not expose Conversation');

        setStatus('connecting', 'Connecting…');
        conversation = await Conversation.startSession({
          signedUrl: cfg.signedUrl,

          onConnect: () => {
            isCallActive = true;
            setStatus('connected', 'Connected');
            $endCallBtn.disabled = false;
            writeHeartbeat();
            startBackendHeartbeat();
            postToOpener('voice-popup-connected');
          },

          onDisconnect: () => handleCallEnded('Call ended'),

          onError: (err) => {
            const msg = (err && (err.message || err.toString())) || 'Unknown error';
            console.error('[VOICE-POPUP] error:', msg);
            setStatus('error', 'Error');
            $endCallBtn.disabled = true;
            postToOpener('voice-popup-error', { error: msg });
          },

          onMessage: ({ message, source }) => {
            const text = (message || '').toString().trim();
            if (!text) return;
            console.log(`[VOICE-POPUP] [${source}]:`, text);
            apiPost('/api/v1/widget/conversations/voice_transcript', {
              source, content: text,
            }).catch(e => console.warn('Transcript save failed:', e?.message));
            postToOpener('voice-popup-transcript', { source, message: text });
          },

          onModeChange: (mode) => {
            $body.classList.toggle('speaking', mode === 'speaking');
          },
        });
      } catch (error) {
        const msg = (error && error.message) || 'unknown';
        console.error('[VOICE-POPUP] startCall failed:', msg);
        setStatus('error',
          (error && (error.name === 'NotAllowedError' || error.name === 'NotFoundError'))
            ? 'Mic denied'
            : 'Failed');
        $endCallBtn.disabled = true;
        postToOpener('voice-popup-error', { error: msg });
      }
    }

    async function endCall(reason) {
      if (!conversation) { handleCallEnded(reason || 'Call ended'); return; }
      $endCallBtn.disabled = true;
      setStatus('connecting', 'Ending…');
      try { await conversation.endSession(); }
      catch (e) { console.warn('[VOICE-POPUP] endSession threw:', e?.message); }
      setTimeout(() => { if (isCallActive) handleCallEnded(reason || 'Call ended'); }, 1500);
    }

    function handleCallEnded(label) {
      isCallActive = false;
      setStatus('ended', label || 'Call ended');
      $endCallBtn.disabled = true;
      conversation = null;
      if (!endedNotified) {
        endedNotified = true;
        apiPost('/api/v1/widget/conversations/voice_call_ended', {}).catch(() => {});
        postToOpener('voice-popup-ended');
      }
      if (_heartbeatTimer) clearInterval(_heartbeatTimer);
      clearHeartbeat();
      stopBackendHeartbeat();
      setTimeout(() => { try { window.close(); } catch (_) {} }, 1200);
    }

    $endCallBtn.addEventListener('click', () => endCall('Call ended'));

    window.addEventListener('beforeunload', () => {
      if (_heartbeatTimer) clearInterval(_heartbeatTimer);
      clearHeartbeat();
      stopBackendHeartbeat();
      if (conversation && isCallActive) {
        try { conversation.endSession(); } catch (_) {}
      }
      if (!endedNotified && cfg) {
        endedNotified = true;
        try {
          const url = new URL('/api/v1/widget/conversations/voice_call_ended', cfg.baseUrl);
          if (cfg.websiteToken)   url.searchParams.set('website_token', cfg.websiteToken);
          if (cfg.cwConversation) url.searchParams.set('cw_conversation', cfg.cwConversation);
          navigator.sendBeacon(url.toString(), new Blob(['{}'], { type: 'application/json' }));
        } catch (_) {}
      }
      postToOpener('voice-popup-closed');
    });

    postToOpener('voice-popup-opened');
    postToOpener('voice-popup-request-config');
    let retries = 0;
    const _retryTimer = setInterval(() => {
      if (_configReceived || retries >= 10) { clearInterval(_retryTimer); return; }
      retries++;
      postToOpener('voice-popup-request-config');
    }, 500);
    setTimeout(() => {
      if (!_configReceived) {
        setStatus('error', 'No config');
        $endCallBtn.disabled = true;
      }
    }, 6000);

    function hexToRgba(hex, alpha) {
      const m = (hex || '').replace('#', '').match(/^([0-9a-f]{6}|[0-9a-f]{3})$/i);
      if (!m) return `rgba(66, 153, 225, ${alpha})`;
      let h = m[1];
      if (h.length === 3) h = h.split('').map(c => c + c).join('');
      const r = parseInt(h.slice(0, 2), 16);
      const g = parseInt(h.slice(2, 4), 16);
      const b = parseInt(h.slice(4, 6), 16);
      return `rgba(${r}, ${g}, ${b}, ${alpha})`;
    }
    function makeFallbackAvatar(name, color) {
      const initials = (name || 'AI')
        .split(/\s+/).slice(0, 2).map(w => w[0]).join('').toUpperCase();
      const svg =
        `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
           <defs>
             <linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
               <stop offset="0%" stop-color="${color}" stop-opacity="1"/>
               <stop offset="100%" stop-color="${color}" stop-opacity="0.82"/>
             </linearGradient>
           </defs>
           <circle cx="50" cy="50" r="50" fill="url(#g)"/>
           <text x="50" y="62" text-anchor="middle"
                 font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif"
                 font-size="36" font-weight="600" fill="white">${initials}</text>
         </svg>`;
      return 'data:image/svg+xml;utf8,' + encodeURIComponent(svg);
    }
  </script>
</body>
</html>
