<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="referrer" content="no-referrer" />
  <title>Voice Call</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --widget-color: #1f93ff;
      --widget-color-soft: rgba(31, 147, 255, 0.12);
      --widget-color-strong: rgba(31, 147, 255, 0.32);

      --text-primary: #0f172a;
      --text-secondary: #475569;
      --text-tertiary: #94a3b8;
      --bg-primary: #ffffff;
      --bg-surface: #fafbfc;
      --border-subtle: #eef2f6;
    }

    html, body {
      height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI',
                   Roboto, 'Helvetica Neue', Arial, sans-serif;
      background: var(--bg-surface);
      color: var(--text-primary);
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    body {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      background:
        radial-gradient(ellipse 100% 60% at 50% 0%,
          var(--widget-color-soft) 0%,
          transparent 70%),
        linear-gradient(180deg, var(--bg-primary) 0%, var(--bg-surface) 100%);
    }

    /* ── Header ────────────────────────────────────────────────────────── */
    .header {
      flex-shrink: 0;
      height: 44px;
      padding: 0 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(255, 255, 255, 0.7);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border-bottom: 1px solid var(--border-subtle);
    }
    .header-title {
      font-size: 10.5px;
      font-weight: 700;
      color: var(--text-tertiary);
      letter-spacing: 1.4px;
      text-transform: uppercase;
    }
    .live-badge {
      display: none;
      align-items: center;
      gap: 5px;
      font-size: 9.5px;
      font-weight: 700;
      color: #dc2626;
      letter-spacing: 0.6px;
    }
    .live-badge.show { display: inline-flex; }
    .live-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #ef4444;
      box-shadow: 0 0 0 3px rgba(239, 68, 68, 0.18);
      animation: live-blink 1.4s ease-in-out infinite;
    }
    @keyframes live-blink {
      0%, 100% { opacity: 1; transform: scale(1); }
      50%      { opacity: 0.4; transform: scale(0.88); }
    }

    /* ── Main stage ────────────────────────────────────────────────────── */
    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 24px 14px;
      gap: 18px;
    }

    .avatar-stack {
      position: relative;
      width: 132px;
      height: 132px;
      display: grid;
      place-items: center;
    }

    /* Pulse rings — adopt widget brand color */
    .pulse-ring {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      border: 2px solid var(--widget-color);
      opacity: 0;
      pointer-events: none;
      animation: pulse-out 2.6s cubic-bezier(0.22, 0.61, 0.36, 1) infinite;
    }
    .pulse-ring:nth-child(2) { animation-delay: 0.9s; }
    .pulse-ring:nth-child(3) { animation-delay: 1.8s; }
    @keyframes pulse-out {
      0%   { transform: scale(1);    opacity: 0.55; }
      85%  { transform: scale(1.45); opacity: 0; }
      100% { transform: scale(1.45); opacity: 0; }
    }

    /* Avatar — soft halo + crisp ring */
    .avatar {
      width: 108px;
      height: 108px;
      border-radius: 50%;
      object-fit: cover;
      background: var(--widget-color-soft);
      box-shadow:
        0 0 0 3px var(--bg-primary),
        0 0 0 5px var(--widget-color),
        0 12px 28px rgba(15, 23, 42, 0.16);
      position: relative;
      z-index: 2;
      transition: box-shadow 280ms ease, transform 280ms ease;
    }
    .speaking .avatar {
      transform: scale(1.04);
      box-shadow:
        0 0 0 3px var(--bg-primary),
        0 0 0 5px var(--widget-color),
        0 0 0 13px var(--widget-color-soft),
        0 12px 28px rgba(15, 23, 42, 0.16);
    }
    .speaking .pulse-ring { animation-duration: 1.3s; }

    /* ── Identity block ────────────────────────────────────────────────── */
    .info {
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }
    .agent-name {
      font-size: 18px;
      font-weight: 700;
      color: var(--text-primary);
      letter-spacing: -0.2px;
      line-height: 1.2;
      max-width: 260px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .agent-role {
      font-size: 11.5px;
      color: var(--text-tertiary);
      letter-spacing: 0.2px;
      font-weight: 500;
    }

    /* Status pill */
    .status {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 5px 13px;
      border-radius: 999px;
      font-size: 11.5px;
      font-weight: 600;
      letter-spacing: 0.1px;
      transition: all 240ms ease;
      margin-top: 4px;
    }
    .status[data-state="connecting"] {
      color: #b45309;
      background: #fffbeb;
      border: 1px solid #fde68a;
    }
    .status[data-state="connected"] {
      color: #15803d;
      background: #f0fdf4;
      border: 1px solid #bbf7d0;
    }
    .status[data-state="ended"],
    .status[data-state="error"] {
      color: var(--text-secondary);
      background: #f1f5f9;
      border: 1px solid #e2e8f0;
    }
    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: currentColor;
      box-shadow: 0 0 0 3px rgba(0, 0, 0, 0.04);
      animation: live-blink 1.4s ease-in-out infinite;
    }

    /* ── Action area ───────────────────────────────────────────────────── */
    .actions {
      flex-shrink: 0;
      padding: 8px 24px 18px;
      display: flex;
      justify-content: center;
    }
    .end-call-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      min-width: 168px;
      padding: 11px 24px;
      border: none;
      border-radius: 999px;
      background: linear-gradient(180deg, #f87171 0%, #ef4444 100%);
      color: #fff;
      font-size: 13.5px;
      font-weight: 700;
      letter-spacing: 0.2px;
      cursor: pointer;
      box-shadow:
        0 1px 0 rgba(255, 255, 255, 0.25) inset,
        0 5px 14px rgba(239, 68, 68, 0.42),
        0 1px 3px rgba(239, 68, 68, 0.35);
      transition: transform 140ms ease, box-shadow 140ms ease, filter 140ms ease;
    }
    .end-call-btn:hover:not(:disabled) {
      transform: translateY(-1.5px);
      filter: brightness(1.05);
      box-shadow:
        0 1px 0 rgba(255, 255, 255, 0.25) inset,
        0 8px 20px rgba(239, 68, 68, 0.48),
        0 1px 3px rgba(239, 68, 68, 0.35);
    }
    .end-call-btn:active:not(:disabled) {
      transform: translateY(0);
      filter: brightness(0.96);
    }
    .end-call-btn:disabled {
      background: #cbd5e1;
      color: #64748b;
      cursor: not-allowed;
      box-shadow: none;
      transform: none;
      filter: none;
    }
    .end-call-btn svg {
      width: 15px;
      height: 15px;
      flex-shrink: 0;
    }

    /* ── Footer ────────────────────────────────────────────────────────── */
    .footer {
      flex-shrink: 0;
      height: 34px;
      padding: 0 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-top: 1px solid var(--border-subtle);
      background: rgba(255, 255, 255, 0.5);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      font-size: 10.5px;
      color: var(--text-tertiary);
      font-weight: 500;
      letter-spacing: 0.2px;
    }
    .footer strong {
      color: var(--text-secondary);
      font-weight: 600;
      margin-left: 4px;
    }
  </style>
</head>

<body>
  <div class="header">
    <span class="header-title">Voice Call</span>
    <div class="live-badge" id="liveBadge">
      <span class="live-dot"></span>
      LIVE
    </div>
  </div>

  <div class="main" id="main">
    <div class="avatar-stack">
      <div class="pulse-ring"></div>
      <div class="pulse-ring"></div>
      <div class="pulse-ring"></div>
      <img class="avatar" id="avatarImg" alt="Agent" />
    </div>

    <div class="info">
      <div class="agent-name" id="agentName">AI Assistant</div>
      <div class="agent-role" id="agentRole">Voice Assistant</div>
      <div class="status" id="status" data-state="connecting">
        <span class="status-dot"></span>
        <span id="statusText">Connecting…</span>
      </div>
    </div>
  </div>

  <div class="actions">
    <button class="end-call-btn" id="endCallBtn" disabled>
      <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
        <path d="M3.5 14.5c5.5-5 11.5-5 17 0 .8.7.9 2 0 2.7l-2.1 1.6c-.5.4-1.2.4-1.7 0l-2-1.7
                 a1.5 1.5 0 0 1-.5-1.1V14a9.8 9.8 0 0 0-4.4 0v0c0 .4-.2.8-.5 1.1l-2 1.6c-.5.4-1.2.4-1.7 0
                 L3.5 15c-.5-.6-.4-1.7 0-2.5Z" transform="rotate(135 12 12)" />
      </svg>
      End Call
    </button>
  </div>

  <div class="footer">
    Powered by <strong id="brandName">Visual Graphx</strong>
  </div>

  <script type="module">
    /* ================================================================= *
     * Secure voice-call popup.                                           *
     * - Config delivered via postMessage (URL stays clean — no secrets). *
     * - ElevenLabs @11labs/client SDK runs here (proven audio path).     *
     * - Each transcript turn POSTed to backend → widget chat shows it    *
     *   live via its existing message-polling loop.                      *
     * ================================================================= */

    const $avatar     = document.getElementById('avatarImg');
    const $agentName  = document.getElementById('agentName');
    const $agentRole  = document.getElementById('agentRole');
    const $brandName  = document.getElementById('brandName');
    const $status     = document.getElementById('status');
    const $statusText = document.getElementById('statusText');
    const $endCallBtn = document.getElementById('endCallBtn');
    const $liveBadge  = document.getElementById('liveBadge');
    const $main       = document.getElementById('main');

    let cfg = null;
    let conversation = null;
    let isCallActive = false;
    let endedNotified = false;
    let _heartbeatTimer = null;
    let _configReceived = false;

    let _channel = null;
    try { _channel = new BroadcastChannel('cw-voice'); } catch (_) {}

    function setStatus(state, text) {
      $status.dataset.state = state;
      $statusText.textContent = text;
      $liveBadge.classList.toggle('show', state === 'connected');
    }
    function applyBranding(c) {
      document.documentElement.style.setProperty('--widget-color', c.color);
      document.documentElement.style.setProperty('--widget-color-soft', hexToRgba(c.color, 0.12));
      document.documentElement.style.setProperty('--widget-color-strong', hexToRgba(c.color, 0.32));
      $agentName.textContent = c.agentName;
      $agentRole.textContent = c.agentRole || 'Voice Assistant';
      if (c.brand) $brandName.textContent = c.brand;
      if (c.avatar) {
        $avatar.src = c.avatar;
        $avatar.onerror = () => { $avatar.src = makeFallbackAvatar(c.agentName, c.color); };
      } else {
        $avatar.src = makeFallbackAvatar(c.agentName, c.color);
      }
    }

    function postToOpener(event, payload = {}) {
      if (!window.opener || window.opener.closed) return;
      try {
        window.opener.postMessage({ source: 'cw-voice-popup', event, ...payload }, '*');
        if (window.opener.parent && window.opener.parent !== window.opener) {
          window.opener.parent.postMessage({ source: 'cw-voice-popup', event, ...payload }, '*');
        }
      } catch (_) {}
    }

    const HEARTBEAT_KEY = 'cw_voice_popup_heartbeat';
    function writeHeartbeat() {
      try { localStorage.setItem(HEARTBEAT_KEY, String(Date.now())); } catch (_) {}
      if (_channel) {
        try { _channel.postMessage({ type: 'heartbeat', timestamp: Date.now(), active: isCallActive }); } catch (_) {}
      }
    }
    function clearHeartbeat() {
      try { localStorage.removeItem(HEARTBEAT_KEY); } catch (_) {}
      if (_channel) {
        try { _channel.postMessage({ type: 'ended', timestamp: Date.now() }); } catch (_) {}
      }
    }

    function apiPost(path, body) {
      if (!cfg) return Promise.reject(new Error('No config yet'));
      const url = new URL(path, cfg.baseUrl);
      if (cfg.websiteToken)   url.searchParams.set('website_token', cfg.websiteToken);
      if (cfg.cwConversation) url.searchParams.set('cw_conversation', cfg.cwConversation);
      return fetch(url.toString(), {
        method: 'POST',
        credentials: 'include',
        headers: {
          'Content-Type': 'application/json',
          ...(cfg.authToken ? { 'X-Auth-Token': cfg.authToken } : {}),
        },
        body: JSON.stringify(body || {}),
      });
    }

    window.addEventListener('message', (e) => {
      const d = e?.data;
      if (!d || typeof d !== 'object') return;
      if (d.source !== 'cw-widget') return;

      if (d.event === 'config' && d.config && !_configReceived) {
        _configReceived = true;
        cfg = d.config;
        applyBranding(cfg);
        startCall();
        return;
      }
      if (d.event === 'request-end-call') {
        endCall('Call ended');
        return;
      }
    });

    if (_channel) {
      _channel.addEventListener('message', (e) => {
        const m = e.data || {};
        if (m.type === 'ping') writeHeartbeat();
        else if (m.type === 'request-end-call') endCall('Call ended');
      });
    }

    async function startCall() {
      if (!cfg?.signedUrl) {
        setStatus('error', 'Missing signed URL');
        return;
      }

      writeHeartbeat();
      _heartbeatTimer = setInterval(writeHeartbeat, 1500);

      try {
        setStatus('connecting', 'Requesting microphone…');
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        stream.getTracks().forEach(t => t.stop());

        setStatus('connecting', 'Loading voice engine…');
        const mod = await import('https://esm.sh/@11labs/client');
        const Conversation = mod.Conversation;
        if (!Conversation) throw new Error('SDK did not expose Conversation');

        setStatus('connecting', 'Connecting to agent…');
        conversation = await Conversation.startSession({
          signedUrl: cfg.signedUrl,

          onConnect: () => {
            isCallActive = true;
            setStatus('connected', 'Connected');
            $endCallBtn.disabled = false;
            writeHeartbeat();
            postToOpener('voice-popup-connected');
          },

          onDisconnect: () => handleCallEnded('Call ended'),

          onError: (err) => {
            const msg = (err && (err.message || err.toString())) || 'Unknown error';
            console.error('[VOICE-POPUP] error:', msg);
            setStatus('error', 'Error: ' + msg);
            $endCallBtn.disabled = true;
            postToOpener('voice-popup-error', { error: msg });
          },

          onMessage: ({ message, source }) => {
            const text = (message || '').toString().trim();
            if (!text) return;
            console.log(`[VOICE-POPUP] 🎙️ transcript [${source}]:`, text);

            apiPost('/api/v1/widget/conversations/voice_transcript', {
              source, content: text,
            }).catch(e => console.warn('Transcript save failed:', e?.message));

            postToOpener('voice-popup-transcript', { source, message: text });
          },

          onModeChange: (mode) => {
            $main.classList.toggle('speaking', mode === 'speaking');
          },
        });
      } catch (error) {
        const msg = (error && error.message) || 'unknown';
        console.error('[VOICE-POPUP] startCall failed:', msg);
        setStatus('error',
          (error && (error.name === 'NotAllowedError' || error.name === 'NotFoundError'))
            ? 'Microphone permission denied'
            : 'Failed: ' + msg);
        $endCallBtn.disabled = true;
        postToOpener('voice-popup-error', { error: msg });
      }
    }

    async function endCall(reason) {
      if (!conversation) { handleCallEnded(reason || 'Call ended'); return; }
      $endCallBtn.disabled = true;
      setStatus('connecting', 'Ending call…');
      try { await conversation.endSession(); }
      catch (e) { console.warn('[VOICE-POPUP] endSession threw:', e?.message); }
      setTimeout(() => { if (isCallActive) handleCallEnded(reason || 'Call ended'); }, 1500);
    }

    function handleCallEnded(label) {
      isCallActive = false;
      setStatus('ended', label || 'Call ended');
      $endCallBtn.disabled = true;
      conversation = null;
      if (!endedNotified) {
        endedNotified = true;
        apiPost('/api/v1/widget/conversations/voice_call_ended', {}).catch(() => {});
        postToOpener('voice-popup-ended');
      }
      if (_heartbeatTimer) clearInterval(_heartbeatTimer);
      clearHeartbeat();
      setTimeout(() => { try { window.close(); } catch (_) {} }, 1200);
    }

    $endCallBtn.addEventListener('click', () => endCall('Call ended'));

    window.addEventListener('beforeunload', () => {
      if (_heartbeatTimer) clearInterval(_heartbeatTimer);
      clearHeartbeat();
      if (conversation && isCallActive) {
        try { conversation.endSession(); } catch (_) {}
      }
      if (!endedNotified && cfg) {
        endedNotified = true;
        try {
          const url = new URL('/api/v1/widget/conversations/voice_call_ended', cfg.baseUrl);
          if (cfg.websiteToken)   url.searchParams.set('website_token', cfg.websiteToken);
          if (cfg.cwConversation) url.searchParams.set('cw_conversation', cfg.cwConversation);
          navigator.sendBeacon(url.toString(), new Blob(['{}'], { type: 'application/json' }));
        } catch (_) {}
      }
      postToOpener('voice-popup-closed');
    });

    postToOpener('voice-popup-opened');
    postToOpener('voice-popup-request-config');
    let retries = 0;
    const _retryTimer = setInterval(() => {
      if (_configReceived || retries >= 10) { clearInterval(_retryTimer); return; }
      retries++;
      postToOpener('voice-popup-request-config');
    }, 500);
    setTimeout(() => {
      if (!_configReceived) {
        setStatus('error', 'No config from opener — close and retry');
        $endCallBtn.disabled = true;
      }
    }, 6000);

    function hexToRgba(hex, alpha) {
      const m = (hex || '').replace('#', '').match(/^([0-9a-f]{6}|[0-9a-f]{3})$/i);
      if (!m) return `rgba(31, 147, 255, ${alpha})`;
      let h = m[1];
      if (h.length === 3) h = h.split('').map(c => c + c).join('');
      const r = parseInt(h.slice(0, 2), 16);
      const g = parseInt(h.slice(2, 4), 16);
      const b = parseInt(h.slice(4, 6), 16);
      return `rgba(${r}, ${g}, ${b}, ${alpha})`;
    }
    function makeFallbackAvatar(name, color) {
      const initials = (name || 'AI')
        .split(/\s+/).slice(0, 2).map(w => w[0]).join('').toUpperCase();
      const svg =
        `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
           <defs>
             <linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
               <stop offset="0%" stop-color="${color}" stop-opacity="1"/>
               <stop offset="100%" stop-color="${color}" stop-opacity="0.85"/>
             </linearGradient>
           </defs>
           <circle cx="50" cy="50" r="50" fill="url(#g)"/>
           <text x="50" y="62" text-anchor="middle"
                 font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif"
                 font-size="38" font-weight="700" fill="white">${initials}</text>
         </svg>`;
      return 'data:image/svg+xml;utf8,' + encodeURIComponent(svg);
    }
  </script>
</body>
</html>
